<div class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Asset Manager</p>
      <h1>Assets</h1>
    </div>
    <button mat-flat-button color="primary" class="add-button" (click)="openAddAssetDialog()">
      <mat-icon>add</mat-icon>
      New asset
    </button>
  </header>

  <div class="table-card">
    <table mat-table [dataSource]="assets">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let asset">{{ asset.name }}</td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let asset">{{ asset.type }}</td>
      </ng-container>

      <ng-container matColumnDef="serialNumber">
        <th mat-header-cell *matHeaderCellDef>Serial number</th>
        <td mat-cell *matCellDef="let asset"><span class="serial">{{ asset.serialNumber }}</span></td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let asset">
          <span class="status-chip" [ngClass]="statusClass(asset.status)">{{ statusLabel(asset.status) }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="assignedTo">
        <th mat-header-cell *matHeaderCellDef>Assigned to</th>
        <td mat-cell *matCellDef="let asset">
          <span class="muted">{{ asset.assignedToEmployee?.fullName || '—' }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let asset">
          <button mat-button color="primary" (click)="openManageDialog(asset)">Manage</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <div class="empty-state" *ngIf="assets.length === 0">
      No assets have been added yet.
    </div>
  </div>
</div>
