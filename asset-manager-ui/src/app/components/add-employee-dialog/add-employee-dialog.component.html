<h2 mat-dialog-title>{{ isEditMode ? 'Edit employee' : 'Add new employee' }}</h2>

<div mat-dialog-content class="form-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Full name</mat-label>
    <input matInput [(ngModel)]="fullName">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="email">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Department</mat-label>
    <input matInput [(ngModel)]="department">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Position</mat-label>
    <input matInput [(ngModel)]="position">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Hire date</mat-label>
    <input matInput type="date" [(ngModel)]="hireDate">
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!isValid" (click)="confirmCreate()">
    {{ isEditMode ? 'Save' : 'Create' }}
  </button>
</div>
