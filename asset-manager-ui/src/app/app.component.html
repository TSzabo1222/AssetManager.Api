<mat-toolbar class="app-toolbar" *ngIf="auth.isLoggedIn()">
  <span class="brand">Asset Manager</span>
  <a routerLink="/assets" routerLinkActive="active-link">Assets</a>
  <a routerLink="/employees" routerLinkActive="active-link">Employees</a>
  <a routerLink="/inventory" routerLinkActive="active-link">Inventory</a>

  <span class="spacer"></span>

  <span class="user-name" *ngIf="auth.currentUser() as user">{{ user.fullName }}</span>

  <button class="theme-toggle" (click)="theme.toggle()" aria-label="Toggle dark mode">
    <mat-icon>{{ theme.isDark() ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </button>

  <button mat-button class="logout-button" (click)="auth.logout()">
    <mat-icon>logout</mat-icon>
    Log out
  </button>
</mat-toolbar>

<router-outlet></router-outlet>

<app-activity-panel *ngIf="auth.isLoggedIn()"></app-activity-panel>
